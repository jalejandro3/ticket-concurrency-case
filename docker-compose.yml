services:
  mysql:
    image: mysql:8.0
    container_name: ticketflow_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketflow
      MYSQL_USER: ticketflow
      MYSQL_PASSWORD: ticketflow
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

  php:
    image: php:8.4-fpm
    container_name: ticketflow_php
    working_dir: /app
    volumes:
      - ./src:/app
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: ticketflow_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  k6:
    image: grafana/k6:latest
    container_name: ticketflow_k6
    volumes:
      - ./k6:/scripts
    depends_on:
      - nginx
    profiles:
      - testing
    network_mode: host